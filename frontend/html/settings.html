<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-i18n="settings_title">Settings – SmartStock</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/feather-icons"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f4f6f9;
      color: #333;
      transition: background 0.3s, color 0.3s;
    }
    .dark-mode { background: #121212; color: #f1f1f1; }
    .dashboard { display: flex; min-height: 100vh; }
    .sidebar {
      width: 250px;
      background: #0f1e34;
      color: #fff;
      padding: 2rem 1rem;
    }
    .sidebar .logo {
      font-size: 1.5rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 2rem;
    }
    .sidebar nav a {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      text-decoration: none;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 0.5rem;
      transition: background 0.2s;
    }
    .sidebar nav a:hover, .sidebar nav a.active {
      background: #1e2e4a;
    }
    main { flex: 1; display: flex; flex-direction: column; }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      padding: 1rem 2rem;
      border-bottom: 1px solid #ddd;
      flex-wrap: wrap;
    }
    .search-bar {
      flex: 1;
      display: flex;
      align-items: center;
      background: #f1f1f1;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      max-width: 500px;
      margin-right: 1rem;
    }
    .search-bar input {
      border: none;
      background: transparent;
      outline: none;
      width: 100%;
      padding-left: 0.5rem;
    }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #007bff;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    .language-container {
      position: relative;
      margin-right: 1rem;
    }
    #langButton {
      background: none;
      border: none;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      color: #003366;
    }
    #langDropdown {
      position: absolute;
      top: 35px;
      right: 0;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
      min-width: 160px;
      list-style: none;
      padding: 0.5rem 0;
      z-index: 99;
    }
    #langDropdown li {
      padding: 8px 16px;
      cursor: pointer;
      white-space: nowrap;
    }
    #langDropdown li:hover { background: #f0f0f0; }
    .hidden { display: none; }
    .profile { display: flex; align-items: center; gap: 0.5rem; }
    .content { padding: 2rem 3rem; }
    .settings-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .settings-card h3 {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.2rem;
      margin-bottom: 1rem;
    }
    .settings-options label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
    }
    .settings-options input[type="text"],
    .settings-options input[type="email"],
    .settings-options select {
      padding: 0.4rem;
      width: 50%;
      min-width: 180px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    .save-btn {
      background: #007bff;
      color: #fff;
      padding: 0.7rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      float: right;
    }
    .dashboard-footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.875rem;
      color: #777;
      clear: both;
    }
    @media (max-width: 768px) {
      .dashboard { flex-direction: column; }
      .sidebar { width: 100%; }
      .top-bar { flex-direction: column; align-items: flex-start; gap: 1rem; }
      .content { padding: 1rem; }
      .settings-options label { flex-direction: column; align-items: flex-start; }
      .settings-options input, .settings-options select { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar">
      <div class="logo"><i data-feather="box"></i><span>SmartStock</span></div>
      <nav>
        <a href="dashboard.html"><i data-feather="home"></i><span data-i18n="dashboard">Dashboard</span></a>
        <a href="add_item.html"><i data-feather="plus-circle"></i><span data-i18n="add_item">Add Item</span></a>
        <a href="update_item.html"><i data-feather="edit-3"></i><span data-i18n="update_item">Update Item</span></a>
        <a href="delete_item.html"><i data-feather="trash-2"></i><span data-i18n="delete_item">Delete Item</span></a>
        <a class="active" href="settings.html"><i data-feather="settings"></i><span data-i18n="settings">Settings</span></a>
        <a href="#" onclick="logout()"><i data-feather="log-out"></i><span data-i18n="logout">Log Out</span></a>
      </nav>
    </aside>

    <main>
      <header class="top-bar">
        <div class="search-bar">
          <i data-feather="search"></i>
          <input type="text" id="searchInput" placeholder="Search settings..." data-i18n-placeholder="search_settings" />
        </div>
        <div style="display: flex; align-items: center; gap: 1rem;">
          <div class="language-container">
            <button id="langButton">
              <i data-feather="globe"></i><span id="currentLang">English</span>
            </button>
            <ul id="langDropdown" class="hidden">
              <li data-lang="en">🇬🇧 English</li>
              <li data-lang="rw">🇷🇼 Kinyarwanda</li>
              <li data-lang="fr">🇫🇷 Français</li>
            </ul>
          </div>
          <div class="profile">
            <div class="avatar" id="profileInitial">U</div>
            <span><strong id="profileName">User</strong></span>
          </div>
        </div>
      </header>

      <section class="content" id="settingsSection">
        <div class="settings-card">
          <h3><i data-feather="user"></i> <span data-i18n="user_preferences">User Preferences</span></h3>
          <div class="settings-options">
            <label><span data-i18n="dark_mode">Enable Dark Mode</span> <input type="checkbox" id="darkMode" /></label>
            <label><span data-i18n="email_notifications">Email Notifications</span> <input type="checkbox" id="emailNotifications" /></label>
            <label><span data-i18n="low_stock">Stock Low Alerts</span> <input type="checkbox" id="lowStockAlert" /></label>
          </div>
        </div>

        <div class="settings-card">
          <h3><i data-feather="sliders"></i> <span data-i18n="system_config">System Configuration</span></h3>
          <div class="settings-options">
            <label><span data-i18n="timezone">Timezone:</span>
              <select id="timezone">
                <option>Africa/Kigali</option>
                <option>UTC</option>
                <option>America/New_York</option>
              </select>
            </label>
            <label><span data-i18n="language">Language:</span>
              <select id="language">
                <option value="English">English</option>
                <option value="Kinyarwanda">Kinyarwanda</option>
                <option value="Français">Français</option>
              </select>
            </label>
          </div>
        </div>

        <div class="settings-card">
          <h3><i data-feather="user-check"></i> <span data-i18n="account_settings">Account Settings</span></h3>
          <div class="settings-options">
            <label><span data-i18n="full_name">Full Name:</span> <input type="text" id="fullName" /></label>
            <label><span data-i18n="email">Email Address:</span> <input type="email" id="emailAddress" /></label>
          </div>
        </div>

        <button class="save-btn" onclick="saveSettings()"><i data-feather="save"></i> <span data-i18n="save_settings_button">Save Settings</span></button>
      </section>

      <footer class="dashboard-footer" data-i18n="footer_text_extended">© 2025 SmartStock. Built by Henriette for businesses and households.</footer>
    </main>
  </div>

<script>
  feather.replace();
  const API_BASE = "https://smartstock-1-1wm7.onrender.com";

  function logout() {
    localStorage.removeItem("access_token");
    window.location.href = 'login.html';
  }

  async function loadUserProfile() {
    const token = localStorage.getItem("access_token");
    if (!token) return;
    try {
      const res = await fetch(`${API_BASE}/api/user/`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (res.ok) {
        const user = await res.json();
        const name = user.first_name?.trim() || user.username || "User";
        document.getElementById("profileInitial").textContent = name[0].toUpperCase();
        document.getElementById("profileName").textContent = name;
      }
    } catch (e) {
      console.error("Could not fetch user", e);
    }
  }

  function saveSettings() {
    localStorage.setItem("darkMode", document.getElementById("darkMode").checked);
    localStorage.setItem("emailNotifications", document.getElementById("emailNotifications").checked);
    localStorage.setItem("lowStockAlert", document.getElementById("lowStockAlert").checked);
    localStorage.setItem("timezone", document.getElementById("timezone").value);
    localStorage.setItem("language", document.getElementById("language").value);
    localStorage.setItem("fullName", document.getElementById("fullName").value);
    localStorage.setItem("emailAddress", document.getElementById("emailAddress").value);
    alert("Settings saved.");
    location.reload();
  }

  function loadSettings() {
    document.getElementById("darkMode").checked = localStorage.getItem("darkMode") === "true";
    document.getElementById("emailNotifications").checked = localStorage.getItem("emailNotifications") === "true";
    document.getElementById("lowStockAlert").checked = localStorage.getItem("lowStockAlert") === "true";
    document.getElementById("timezone").value = localStorage.getItem("timezone") || "Africa/Kigali";
    document.getElementById("language").value = localStorage.getItem("language") || "English";
    document.getElementById("fullName").value = localStorage.getItem("fullName") || "User";
    document.getElementById("emailAddress").value = localStorage.getItem("emailAddress") || "user@example.com";
    if (localStorage.getItem("darkMode") === "true") {
      document.body.classList.add("dark-mode");
    }
  }

  function loadTranslations(lang) {
    fetch(`../lang/${lang}.json`).then(res => res.json()).then(data => {
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (data[key]) el.textContent = data[key];
      });
      document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
        const key = el.getAttribute("data-i18n-placeholder");
        if (data[key]) el.placeholder = data[key];
      });
    });
  }

  function updateCurrentLang(lang) {
    const map = { en: "English", rw: "Kinyarwanda", fr: "Français" };
    document.getElementById("currentLang").textContent = map[lang] || "English";
  }

  document.addEventListener("DOMContentLoaded", () => {
    loadSettings();
    loadUserProfile();

    document.getElementById("searchInput").addEventListener("input", e => {
      const value = e.target.value.toLowerCase();
      document.querySelectorAll(".settings-card").forEach(card => {
        card.style.display = card.textContent.toLowerCase().includes(value) ? "" : "none";
      });
    });

    const langButton = document.getElementById("langButton");
    const langDropdown = document.getElementById("langDropdown");

    langButton.addEventListener("click", () => langDropdown.classList.toggle("hidden"));
    document.addEventListener("click", e => {
      if (!langButton.contains(e.target) && !langDropdown.contains(e.target)) {
        langDropdown.classList.add("hidden");
      }
    });

    document.querySelectorAll("#langDropdown li").forEach(li => {
      li.addEventListener("click", () => {
        const lang = li.getAttribute("data-lang");
        localStorage.setItem("selectedLang", lang);
        updateCurrentLang(lang);
        loadTranslations(lang);
        langDropdown.classList.add("hidden");
      });
    });

    const savedLang = localStorage.getItem("selectedLang") || "en";
    updateCurrentLang(savedLang);
    loadTranslations(savedLang);
  });
</script>
</body>
</html>
