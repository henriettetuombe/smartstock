<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Settings – SmartStock</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/feather-icons"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f4f6f9;
      color: #333;
      transition: background 0.3s, color 0.3s;
    }
    .dark-mode {
      background: #121212;
      color: #f1f1f1;
    }
    .dashboard {
      display: flex;
      min-height: 100vh;
      flex-direction: row;
    }
    .sidebar {
      width: 250px;
      background: #0f1e34;
      color: #fff;
      padding: 2rem 1rem;
    }
    .sidebar .logo {
      font-size: 1.5rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 2rem;
    }
    .sidebar nav a {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      text-decoration: none;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 0.5rem;
      transition: background 0.2s;
    }
    .sidebar nav a:hover, .sidebar nav a.active {
      background: #1e2e4a;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      padding: 1rem 2rem;
      border-bottom: 1px solid #ddd;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .profile-box {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .search-input {
      padding: 0.5rem 1rem;
      border: 1px solid #ccc;
      border-radius: 20px;
      outline: none;
    }
    .profile {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #007bff;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    .content {
      padding: 2rem 3rem;
    }
    .section-title {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    .settings-card {
      background: #fff;
      padding: 1.5rem;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .settings-card h3 {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.2rem;
      margin-bottom: 1rem;
    }
    .settings-options {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .settings-options label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .settings-options input[type="text"],
    .settings-options input[type="email"],
    .settings-options input[type="password"],
    .settings-options select {
      padding: 0.4rem;
      width: 50%;
      min-width: 180px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    .sticky-footer {
      text-align: right;
      margin-top: 1rem;
    }
    .save-btn {
      background: #007bff;
      color: #fff;
      padding: 0.7rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .dashboard-footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.875rem;
      color: #777;
    }

    @media (max-width: 768px) {
      .dashboard {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        padding: 1rem;
        text-align: center;
      }
      .top-bar {
        flex-direction: column;
        align-items: flex-start;
      }
      .content {
        padding: 1rem;
      }
      .settings-options label {
        flex-direction: column;
        align-items: flex-start;
      }
      .settings-options input,
      .settings-options select {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar">
      <div class="logo"><i data-feather="box"></i> <span>SmartStock</span></div>
      <nav>
        <a href="dashboard.html"><i data-feather="home"></i> Dashboard</a>
        <a href="add_item.html"><i data-feather="plus-circle"></i> Add Item</a>
        <a href="update_item.html"><i data-feather="edit-3"></i> Update Item</a>
        <a href="delete_item.html"><i data-feather="trash-2"></i> Delete Item</a>
        <a class="active" href="settings.html"><i data-feather="settings"></i> Settings</a>
        <a href="#" onclick="logout()"><i data-feather="log-out"></i> Log Out</a>
      </nav>
    </aside>

    <main>
      <header class="top-bar">
        <h1>Settings</h1>
        <div class="profile-box">
          <input type="text" class="search-input" placeholder="Search settings..." />
          <div class="profile">
            <div class="avatar" id="profileInitial">U</div>
            <span><strong id="profileName">User</strong></span>
          </div>
        </div>
      </header>

      <section class="content">
        <h2 class="section-title">App Settings</h2>

        <div class="settings-card">
          <h3><i data-feather="user"></i> User Preferences</h3>
          <div class="settings-options">
            <label>Enable Dark Mode <input type="checkbox" id="darkMode" /></label>
            <label>Email Notifications <input type="checkbox" id="emailNotifications" /></label>
            <label>Auto-Save Inventory Updates <input type="checkbox" id="autoSave" /></label>
          </div>
        </div>

        <div class="settings-card">
          <h3><i data-feather="bell"></i> Notifications</h3>
          <div class="settings-options">
            <label>Stock Running Low Alerts <input type="checkbox" id="lowStockAlert" /></label>
            <label>Weekly Inventory Summary Emails <input type="checkbox" id="weeklySummary" /></label>
          </div>
        </div>

        <div class="settings-card">
          <h3><i data-feather="sliders"></i> System Configuration</h3>
          <div class="settings-options">
            <label>Timezone:
              <select id="timezone">
                <option>Africa/Kigali</option>
                <option>UTC</option>
                <option>America/New_York</option>
              </select>
            </label>
            <label>Default Language:
              <select id="language">
                <option>English</option>
                <option>Kinyarwanda</option>
                <option>Français</option>
              </select>
            </label>
          </div>
        </div>

        <div class="settings-card">
          <h3><i data-feather="user-check"></i> Account Settings</h3>
          <div class="settings-options">
            <label>Full Name: <input type="text" id="fullName" /></label>
            <label>Email Address: <input type="email" id="emailAddress" /></label>
            <label>Password: <input type="password" value="********" /></label>
          </div>
        </div>

        <div class="sticky-footer">
          <button class="save-btn" onclick="saveSettings()"><i data-feather="save"></i> Save Settings</button>
        </div>
      </section>

      <footer class="dashboard-footer">
        © 2025 SmartStock. Built by Henriette for individuals and businesses.
      </footer>
    </main>
  </div>

  <script>
    feather.replace();
    const token = localStorage.getItem("access_token");

    function logout() {
      localStorage.removeItem("access_token");
      window.location.href = 'login.html';
    }

    function saveSettings() {
      localStorage.setItem("darkMode", document.getElementById("darkMode").checked);
      localStorage.setItem("emailNotifications", document.getElementById("emailNotifications").checked);
      localStorage.setItem("autoSave", document.getElementById("autoSave").checked);
      localStorage.setItem("lowStockAlert", document.getElementById("lowStockAlert").checked);
      localStorage.setItem("weeklySummary", document.getElementById("weeklySummary").checked);
      localStorage.setItem("timezone", document.getElementById("timezone").value);
      localStorage.setItem("language", document.getElementById("language").value);
      localStorage.setItem("fullName", document.getElementById("fullName").value);
      localStorage.setItem("emailAddress", document.getElementById("emailAddress").value);
      alert("Settings saved.");
      location.reload();
    }

    function loadSettings() {
      document.getElementById("darkMode").checked = localStorage.getItem("darkMode") === "true";
      document.getElementById("emailNotifications").checked = localStorage.getItem("emailNotifications") === "true";
      document.getElementById("autoSave").checked = localStorage.getItem("autoSave") === "true";
      document.getElementById("lowStockAlert").checked = localStorage.getItem("lowStockAlert") === "true";
      document.getElementById("weeklySummary").checked = localStorage.getItem("weeklySummary") === "true";
      document.getElementById("timezone").value = localStorage.getItem("timezone") || "Africa/Kigali";
      document.getElementById("language").value = localStorage.getItem("language") || "English";
      document.getElementById("fullName").value = localStorage.getItem("fullName") || "User";
      document.getElementById("emailAddress").value = localStorage.getItem("emailAddress") || "user@example.com";

      if (localStorage.getItem("darkMode") === "true") {
        document.body.classList.add("dark-mode");
      }

      const name = localStorage.getItem("fullName") || "User";
      document.getElementById("profileInitial").textContent = name[0].toUpperCase();
      document.getElementById("profileName").textContent = name;
    }

    document.addEventListener("DOMContentLoaded", loadSettings);
  </script>
</body>
</html>
