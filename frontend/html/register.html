<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-i18n="register_page_title">Register - SmartStock</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .register-container {
      width: 90%;
      max-width: 700px;
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }
    .form-section h1 {
      font-size: 26px;
      margin-bottom: 10px;
    }
    .brand { color: #001f54; }
    .subtext {
      margin-bottom: 30px;
      font-size: 15px;
      color: #555;
    }
    .form-group {
      display: flex;
      gap: 20px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    .form-group > div, .full-width {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    label {
      font-weight: 600;
      margin-bottom: 5px;
      color: #333;
    }
    input, select {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    input:focus, select:focus {
      border-color: #001f54;
      outline: none;
    }
    .error {
      color: #d32f2f;
      font-size: 0.8rem;
      margin-top: 4px;
    }
    .password-toggle {
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }
    #password-strength {
      font-size: 0.85rem;
      margin-top: 0.4rem;
      font-weight: 500;
    }
    .terms {
      margin: 15px 0;
      font-size: 14px;
    }
    .terms label {
      font-weight: normal;
    }
    .signup-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #001f54;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .signup-btn:hover {
      background-color: #003176;
    }
    .signup-btn .loader {
      display: none;
      border: 3px solid #fff;
      border-top: 3px solid #0d1540;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      margin-left: 10px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .login-text {
      margin-top: 20px;
      font-size: 14px;
      text-align: center;
    }
    .login-text a {
      color: #001f54;
      text-decoration: none;
    }
    .login-text a:hover {
      text-decoration: underline;
    }
    .legal-links {
      margin-top: 25px;
      text-align: center;
      font-size: 14px;
      color: #666;
    }
    .legal-links a {
      margin: 0 10px;
      color: #001f54;
      text-decoration: none;
    }
    .legal-links a:hover {
      text-decoration: underline;
    }
    #successToast {
      display: none;
      position: fixed;
      top: 20px;
      right: 20px;
      background: #4BB543;
      color: white;
      padding: 14px 20px;
      border-radius: 8px;
      font-size: 16px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      z-index: 1000;
    }
    @media (max-width: 600px) {
      .form-group {
        flex-direction: column;
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="register-container">
    <div class="form-section">
      <h1>
        <span data-i18n="create_account">Create your</span>
        <span class="brand" data-i18n="app_name"></span>
        <span data-i18n="account">Account</span>
      </h1>
      <p class="subtext" data-i18n="start_managing">Start managing your stock in seconds</p>
      <form id="registerForm" novalidate>
        <div class="form-group">
          <div>
            <label for="firstName" data-i18n="first_name">First Name</label>
            <input type="text" id="firstName" name="first_name" required placeholder="Enter first name" />
            <small class="error" id="firstNameError"></small>
          </div>
          <div>
            <label for="lastName" data-i18n="last_name">Last Name</label>
            <input type="text" id="lastName" name="last_name" required placeholder="Enter last name" />
            <small class="error" id="lastNameError"></small>
          </div>
        </div>
        <div class="form-group">
          <div>
            <label for="email" data-i18n="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="Enter your email address" />
            <small class="error" id="emailError"></small>
          </div>
          <div>
            <label for="phone" data-i18n="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone_number" required pattern="[0-9]{10,}" placeholder="Enter your phone number" />
            <small class="error" id="phoneError"></small>
          </div>
        </div>
        <div class="full-width">
          <label for="accountType" data-i18n="account_type">Account Type</label>
          <select id="accountType" name="account_type" required>
            <option disabled selected data-i18n="account_type_placeholder">Select account type</option>
            <option value="Individual" data-i18n="individual">Individual</option>
            <option value="Business" data-i18n="business">Business</option>
          </select>
          <small class="error" id="accountTypeError"></small>
        </div>
        <div class="full-width">
          <label for="password" data-i18n="password">Password</label>
          <input type="password" id="password" name="password" minlength="8" required placeholder="Minimum 8 characters" />
          <small class="error" id="passwordError"></small>
          <div id="password-strength"></div>
        </div>
        <div class="full-width">
          <label for="confirmPassword" data-i18n="confirm_password">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirm_password" required placeholder="Re-type password" />
          <small class="error" id="confirmPasswordError"></small>
        </div>
        <div class="password-toggle">
          <input type="checkbox" id="togglePassword" />
          <label for="togglePassword" data-i18n="show_passwords">Show Passwords</label>
        </div>
        <div class="terms">
          <input type="checkbox" id="terms" required />
          <label for="terms">
            <span data-i18n="agree_to_terms">I agree to all</span>
            <a href="terms.html"><span data-i18n="terms">terms</span></a>,
            <a href="privacy.html"><span data-i18n="privacy">privacy policies</span></a>,
            <a href="fees.html"><span data-i18n="fees">fees</span></a>
          </label>
        </div>
        <button type="submit" class="signup-btn" id="signupBtn">
          <span class="btn-text" data-i18n="signup">Sign up</span>
          <span class="loader"></span>
        </button>
        <p class="login-text">
          <span data-i18n="already_have_account">Already have an account?</span>
          <a id="login-link" href="login.html" data-i18n="login_now">Log in now</a>
        </p>
      </form>
    </div>
    <div class="legal-links">
      <a href="terms.html" data-i18n="terms_link">Terms of Use</a>
      <a href="privacy.html" data-i18n="privacy_link">Privacy Policy</a>
      <a href="fees.html" data-i18n="fees_link">Pricing & Fees</a>
    </div>
  </div>

  <div id="successToast"> Registration successful! Redirecting...</div>

  <script>
    const API_BASE = 'https://smartstock-1-1wm7.onrender.com';

    document.addEventListener("DOMContentLoaded", () => {
      const lang = new URLSearchParams(window.location.search).get("lang") || localStorage.getItem("selectedLang") || "en";
      localStorage.setItem("selectedLang", lang);
      loadTranslations(lang);
      const loginLink = document.getElementById("login-link");
      if (loginLink) loginLink.href = `login.html?lang=${lang}`;
    });

    function loadTranslations(lang) {
      fetch(`../lang/${lang}.json`)
        .then(res => res.json())
        .then(translations => {
          document.querySelectorAll("[data-i18n]").forEach(el => {
            const key = el.getAttribute("data-i18n");
            if (translations[key]) el.innerHTML = translations[key];
          });
          document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
            const key = el.getAttribute("data-i18n-placeholder");
            if (translations[key]) el.placeholder = translations[key];
          });
          document.querySelectorAll("option[data-i18n]").forEach(option => {
            const key = option.getAttribute("data-i18n");
            if (translations[key]) option.textContent = translations[key];
          });
          if (translations["register_page_title"]) {
            document.title = translations["register_page_title"];
          }
        });
    }

    document.getElementById('togglePassword').addEventListener('change', function () {
      const type = this.checked ? 'text' : 'password';
      document.getElementById('password').type = type;
      document.getElementById('confirmPassword').type = type;
    });

    document.getElementById('password').addEventListener('input', function () {
      const strength = document.getElementById('password-strength');
      const val = this.value;
      if (val.length < 8) {
        strength.textContent = 'Weak';
        strength.style.color = '#d32f2f';
      } else if (val.length < 12) {
        strength.textContent = 'Moderate';
        strength.style.color = '#fbc02d';
      } else {
        strength.textContent = 'Strong';
        strength.style.color = '#388e3c';
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const accountType = document.getElementById('accountType').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const agreed = document.getElementById('terms').checked;

      let hasError = false;
      const clearErrors = () => {
        ['firstName', 'lastName', 'email', 'phone', 'password', 'confirmPassword', 'accountType'].forEach(id => {
          const el = document.getElementById(id + 'Error');
          if (el) el.textContent = '';
        });
      };
      clearErrors();

      if (!firstName) { document.getElementById('firstNameError').textContent = 'First name is required.'; hasError = true; }
      if (!lastName) { document.getElementById('lastNameError').textContent = 'Last name is required.'; hasError = true; }
      if (!email) { document.getElementById('emailError').textContent = 'Email is required.'; hasError = true; }
      if (!phone.match(/^\d{10,}$/)) { document.getElementById('phoneError').textContent = 'Phone must be at least 10 digits.'; hasError = true; }
      if (!accountType || accountType === 'Select account type') { document.getElementById('accountTypeError').textContent = 'Please select an account type.'; hasError = true; }
      if (password.length < 8) { document.getElementById('passwordError').textContent = 'Password must be at least 8 characters.'; hasError = true; }
      if (password !== confirmPassword) { document.getElementById('confirmPasswordError').textContent = 'Passwords do not match.'; hasError = true; }
      if (!agreed) { alert('You must agree to the terms.'); hasError = true; }
      if (hasError) return;

      const btnText = document.querySelector(".btn-text");
      const loader = document.querySelector(".loader");
      btnText.style.display = 'none'; loader.style.display = 'inline-block';

      try {
        const res = await fetch(`${API_BASE}/api/register/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: email, first_name: firstName, last_name: lastName, email, phone_number: phone, account_type: accountType, password, confirm_password: confirmPassword })
        });

        if (res.ok) {
          document.getElementById("successToast").style.display = "block";
          setTimeout(() => {
            document.getElementById("successToast").style.display = "none";
            window.location.href = `login.html?lang=${localStorage.getItem('selectedLang') || 'en'}`;
          }, 2000);
        } else {
          const data = await res.json();
          const errorMessages = Object.entries(data).map(([field, messages]) => `${field}: ${messages.join(', ')}`).join('\n');
          alert('Registration failed:\n' + errorMessages);
        }
      } catch (err) {
        console.error(err);
        alert('Something went wrong. Please try again later.');
      } finally {
        loader.style.display = 'none';
        btnText.style.display = 'inline-block';
      }
    });
  </script>
</body>
</html>
