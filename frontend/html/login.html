<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-i18n="login_page_title">Login - SmartStock</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }
    body {
      margin: 0;
      background-color: #f8f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-container {
      display: flex;
      width: 90%;
      max-width: 900px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      position: relative;
    }
    .form-section {
      flex: 1;
      padding: 40px;
    }
    .form-section h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #1a1a1a;
    }
    .form-section .brand {
      color: #001f54;
    }
    .subtext {
      color: #555;
      font-size: 16px;
      margin-bottom: 30px;
    }
    .google-signin {
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 25px;
      padding: 10px 20px;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 25px;
      transition: background 0.3s ease;
    }
    .google-signin:hover {
      background-color: #f0f0f0;
    }
    form label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: 600;
      color: #333;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-bottom: 10px;
      transition: border-color 0.3s;
    }
    input:focus {
      border-color: #001f54;
      outline: none;
    }
    .form-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      font-size: 14px;
    }
    .login-btn {
      width: 100%;
      padding: 12px;
      background-color: #001f54;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 16px;
      margin-top: 20px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .login-btn:hover {
      background-color: #003176;
    }
    .signup-text {
      margin-top: 20px;
      font-size: 14px;
    }
    .signup-text a {
      color: #001f54;
      text-decoration: none;
    }
    .signup-text a:hover {
      text-decoration: underline;
    }
    .image-section {
      flex: 1;
      display: none;
    }
    .image-section img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    @media (min-width: 768px) {
      .image-section {
        display: block;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="form-section">
      <h1><span data-i18n="welcome">Welcome to</span> <span class="brand" data-i18n="app_name">SmartStock</span></h1>
      <p class="subtext" data-i18n="subtext">Manage your inventory easily across all your devices</p>

      <button class="google-signin" onclick="signInWithGoogle()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Icon" width="20" height="20" />
        <span data-i18n="google_sign_in">Sign in with Google</span>
      </button>

      <form id="loginForm">
        <label for="username" data-i18n="username">Username or Email*</label>
        <input type="text" id="username" data-i18n-placeholder="username" placeholder="Enter your username or email" required />

        <label for="password" data-i18n="password">Password*</label>
        <input type="password" id="password" data-i18n-placeholder="password" placeholder="Minimum 8 characters" minlength="8" required />

        <div class="form-footer">
          <label class="remember-me">
            <input type="checkbox" /> <span data-i18n="remember_me">Remember me</span>
          </label>
          <a href="#" data-i18n="forgot_password">Forgot password?</a>
        </div>

        <button type="submit" class="login-btn" data-i18n="login">Login</button>
      </form>

      <p class="signup-text">
        <span data-i18n="signup_text">New to SmartStock?</span>
        <a id="signup-link" data-i18n="signup_here" href="register.html">Sign up here</a>
      </p>
    </div>

    <div class="image-section">
      <img src="../images/login-image.jpg" alt="Inventory management image" />
    </div>
  </div>

  <script>
    const API_BASE = 'https://smartstock-1-1wm7.onrender.com';

    document.addEventListener("DOMContentLoaded", function () {
      const lang = new URLSearchParams(window.location.search).get('lang') || localStorage.getItem("selectedLang") || "en";
      localStorage.setItem("selectedLang", lang);
      loadTranslations(lang);
      document.getElementById("signup-link").href = `register.html?lang=${lang}`;
    });

    function loadTranslations(lang) {
      fetch(`../lang/${lang}.json`)
        .then(res => res.json())
        .then(translations => {
          document.querySelectorAll("[data-i18n]").forEach(el => {
            const key = el.getAttribute("data-i18n");
            if (translations[key]) el.innerHTML = translations[key];
          });

          document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
            const key = el.getAttribute("data-i18n-placeholder");
            if (translations[key]) el.setAttribute("placeholder", translations[key]);
          });

          if (translations["login_page_title"]) {
            document.title = translations["login_page_title"];
          }
        });
    }

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch(`${API_BASE}/api/token/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        let data;
        try {
          data = await res.json();
        } catch (jsonErr) {
          console.error("Invalid JSON response:", await res.text());
          return alert("Unexpected server response. Check console.");
        }

        if (res.ok && data.access && data.refresh) {
          localStorage.setItem('access_token', data.access);
          localStorage.setItem('refresh_token', data.refresh);
          alert('Login successful!');
          window.location.href = `dashboard.html?lang=${localStorage.getItem('selectedLang') || 'en'}`;
        } else {
          console.error("Backend error response:", data);
          alert(data.error || data.detail || 'Login failed. Please check your credentials.');
        }
      } catch (err) {
        console.error('Login request failed:', err);
        alert('Something went wrong. Try again later.');
      }
    });

    function signInWithGoogle() {
      const clientId = "YOUR_GOOGLE_CLIENT_ID";
      const redirectUri = "https://smartstock-frontend.netlify.app/html/login.html";
      const scope = "openid profile email";
      const responseType = "token";
      const oauthUrl = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${clientId}&redirect_uri=${redirectUri}&response_type=${responseType}&scope=${scope}`;
      window.location.href = oauthUrl;
    }
  </script>
</body>
</html>
