<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Item – SmartStock</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/feather-icons"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f4f6f9;
      color: #333;
    }
    .dashboard {
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 250px;
      background: #0f1e34;
      color: #fff;
      padding: 2rem 1rem;
    }
    .sidebar .logo {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sidebar nav a {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      text-decoration: none;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 0.5rem;
      transition: background 0.2s;
    }
    .sidebar nav a:hover, .sidebar nav a.active {
      background: #1e2e4a;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      padding: 1rem 2rem;
      border-bottom: 1px solid #ddd;
    }
    .profile-box {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .search-input {
      padding: 0.5rem 1rem;
      border: 1px solid #ccc;
      border-radius: 20px;
      outline: none;
    }
    .profile {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #007bff;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    .content {
      padding: 2rem 3rem;
    }
    .section-title {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    .add-item-form {
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      margin-bottom: 2rem;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .form-grid input, .form-grid select {
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      width: 100%;
    }
    .save-btn {
      background: #007bff;
      color: #fff;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }
    th, td {
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    th {
      background: #f9fafc;
    }
    .dashboard-footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.875rem;
      color: #777;
    }
    @media (max-width: 768px) {
      .top-bar {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }
    }
@media (max-width: 768px) {
  .dashboard {
    flex-direction: column;
  }

  .sidebar {
    width: 100%;
    padding: 1rem;
    text-align: center;
  }

  .top-bar {
    flex-direction: column;
    align-items: flex-start;
    gap: 1rem;
  }

  .content {
    padding: 1rem;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }

  .add-item-form {
    padding: 1rem;
  }

  table, th, td {
    font-size: 0.875rem;
    word-break: break-word;
  }
}

  </style>
</head>
<body>
  <div class="dashboard">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo"><i data-feather="box"></i><span>SmartStock</span></div>
      <nav>
        <a href="dashboard.html"><i data-feather="home"></i>Dashboard</a>
        <a class="active" href="#"><i data-feather="plus-circle"></i>Add Item</a>
        <a href="update_item.html"><i data-feather="edit-3"></i>Update Item</a>
        <a href="delete_item.html"><i data-feather="trash-2"></i>Delete Item</a>
        <a href="settings.html"><i data-feather="settings"></i>Settings</a>
        <a href="#" onclick="logout()"><i data-feather="log-out"></i>Log Out</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main>
      <header class="top-bar">
        <div>
          <h1 id="welcomeText">Welcome back</h1>
          <p class="subtitle">Let’s keep your inventory up to date</p>
        </div>
        <div class="profile-box">
          <input type="text" id="searchInput" class="search-input" placeholder="Search items..." />
          <div class="profile">
            <span><strong id="profileName">User</strong></span>
            <div class="avatar" id="profileInitial">U</div>
          </div>
        </div>
      </header>

      <section class="content">
        <h2 class="section-title">Add New Items to Stock</h2>
        <form class="add-item-form" id="addItemForm">
          <div class="form-grid">
            <input type="text" id="itemName" placeholder="Item Name" required />
            <input type="date" id="itemDate" required />
            <select id="itemCategory" required>
              <option disabled selected value="">Select Category</option>
            </select>
            <input type="number" id="itemQuantity" placeholder="Quantity" min="0" required />
            <select id="itemStatus" required>
              <option value="in_stock">In Stock</option>
              <option value="running_low">Running Low</option>
              <option value="out_of_stock">Out of Stock</option>
            </select>
          </div>
          <button type="submit" class="save-btn"><i data-feather="plus"></i> Add Item</button>
        </form>

        <table>
          <thead>
            <tr>
              <th>Item</th>
              <th>Date</th>
              <th>Category</th>
              <th>Quantity</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="itemTableBody">
            <tr><td colspan="5">Loading items...</td></tr>
          </tbody>
        </table>
      </section>

      <footer class="dashboard-footer">
        © 2025 SmartStock. Built by Henriette for individuals and businesses.
      </footer>
    </main>
  </div>

  <script>
    feather.replace();
    const token = localStorage.getItem('access_token');
    if (!token) logout();

    function logout() {
      localStorage.removeItem('access_token');
      window.location.href = 'login.html';
    }

    async function fetchUserInfo() {
      try {
        const res = await fetch('http://localhost:8000/api/user/', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const user = await res.json();
        const name = user.first_name?.trim() || user.username || 'User';
        const initial = name.charAt(0).toUpperCase();

        document.getElementById('profileInitial').textContent = initial;
        document.getElementById('profileName').textContent = name;
        document.getElementById('welcomeText').textContent = `Welcome back, ${name}`;
      } catch (err) {
        console.error('User info error:', err);
        logout();
      }
    }

    async function loadCategories() {
      const select = document.getElementById('itemCategory');
      try {
        const res = await fetch('http://localhost:8000/api/categories/', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const categories = await res.json();
        categories.forEach(cat => {
          const opt = document.createElement('option');
          opt.value = cat.id;
          opt.textContent = cat.name;
          select.appendChild(opt);
        });
      } catch (err) {
        console.error('Load categories failed:', err);
      }
    }

    async function loadItems() {
      const tbody = document.getElementById('itemTableBody');
      try {
        const res = await fetch('http://localhost:8000/api/items/', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const items = await res.json();
        tbody.innerHTML = '';
        items.forEach(item => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${item.name}</td>
            <td>${new Date(item.date_added).toLocaleDateString()}</td>
            <td>${item.category?.name || item.category}</td>
            <td>${item.quantity}</td>
            <td>${item.status.replace('_', ' ')}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error('Load items failed:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      fetchUserInfo();
      loadCategories();
      loadItems();

      document.getElementById('addItemForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const name = document.getElementById('itemName').value;
        const date = document.getElementById('itemDate').value;
        const categoryId = parseInt(document.getElementById('itemCategory').value);
        const quantity = document.getElementById('itemQuantity').value;
        const status = document.getElementById('itemStatus').value;

        if (isNaN(categoryId)) {
          alert('Please select a valid category.');
          return;
        }

        try {
          const res = await fetch('http://localhost:8000/api/items/', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
              name,
              date_added: date,
              category_id: categoryId,
              quantity,
              status
            })
          });

          if (res.ok) {
            alert('Item added successfully!');
            this.reset();
            loadItems();
          } else {
            const error = await res.json();
            alert(error.detail || 'Error adding item');
          }
        } catch (err) {
          console.error('Add item failed:', err);
          alert('Something went wrong');
        }
      });
    });
  </script>
</body>
</html>
