<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Update Item – SmartStock</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/feather-icons"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f4f6f9;
      color: #333;
    }
    .dashboard { display: flex; min-height: 100vh; }
    .sidebar {
      width: 250px;
      background: #0f1e34;
      color: #fff;
      padding: 2rem 1rem;
    }
    .sidebar .logo {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sidebar nav a {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      text-decoration: none;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 0.5rem;
      transition: background 0.2s;
    }
    .sidebar nav a:hover, .sidebar nav a.active { background: #1e2e4a; }

    main { flex: 1; display: flex; flex-direction: column; }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      padding: 1rem 2rem;
      border-bottom: 1px solid #ddd;
    }
    .profile-box {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .search-input {
      padding: 0.5rem 1rem;
      border: 1px solid #ccc;
      border-radius: 20px;
      outline: none;
    }
    .profile {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #007bff;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    .content { padding: 2rem 3rem; }
    .section-title { font-size: 1.5rem; margin-bottom: 1rem; }

    .toolbar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
      position: relative;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .btn-sm {
      padding: 0.4rem 0.8rem;
      background: #007bff;
      border: none;
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .filter-dropdown {
      position: absolute;
      top: 2.5rem;
      right: 5rem;
      background: white;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      display: none;
      flex-direction: column;
      z-index: 10;
    }
    .filter-dropdown button {
      padding: 0.5rem 1rem;
      background: none;
      border: none;
      text-align: left;
      cursor: pointer;
    }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }
    th, td {
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid #eee;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 120px;
    }
    th { background: #f9fafc; }

    .sticky-footer {
      text-align: right;
      margin-top: 1rem;
    }
    .save-btn {
      background: #007bff;
      color: #fff;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .dashboard-footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.875rem;
      color: #777;
    }

    @media (max-width: 768px) {
      .dashboard { flex-direction: column; }
      .sidebar {
        width: 100%;
        text-align: center;
        padding: 1rem;
      }
      .top-bar {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
        padding: 1rem;
      }
      .content { padding: 1rem; }
      .toolbar {
        flex-direction: column;
        align-items: flex-start;
      }
      th, td {
        font-size: 0.85rem;
        white-space: nowrap;
      }
      .filter-dropdown { right: 1rem; }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar">
      <div class="logo"><i data-feather="box"></i><span>SmartStock</span></div>
      <nav>
        <a href="dashboard.html"><i data-feather="home"></i>Dashboard</a>
        <a href="add_item.html"><i data-feather="plus-circle"></i>Add Item</a>
        <a class="active" href="update_item.html"><i data-feather="edit-3"></i>Update Item</a>
        <a href="delete_item.html"><i data-feather="trash-2"></i>Delete Item</a>
        <a href="settings.html"><i data-feather="settings"></i>Settings</a>
        <a href="#" onclick="logout()"><i data-feather="log-out"></i>Log Out</a>
      </nav>
    </aside>
    <main>
      <header class="top-bar">
        <div>
          <h1 id="welcomeText">Welcome back</h1>
          <p class="subtitle">Let’s keep your inventory up to date</p>
        </div>
        <div class="profile-box">
          <input type="text" class="search-input" placeholder="Search here..." aria-label="Search" />
          <div class="profile">
            <span><strong id="profileName">User</strong></span>
            <div class="avatar" id="profileInitial">U</div>
          </div>
        </div>
      </header>
      <section class="content">
        <h2 class="section-title">Update Item</h2>
        <div class="toolbar">
          <div></div>
          <div class="filter-group">
            <button class="btn-sm" onclick="toggleFilterDropdown(event)"><i data-feather="filter"></i>Filter</button>
            <button class="btn-sm" onclick="viewMoreToggle()"><i data-feather="eye"></i>View More</button>
          </div>
          <div class="filter-dropdown" id="filterDropdown">
            <button onclick="applyFilter('all')">All</button>
            <button onclick="applyFilter('in_stock')">In Stock</button>
            <button onclick="applyFilter('running_low')">Running Low</button>
            <button onclick="applyFilter('out_of_stock')">Out of Stock</button>
          </div>
        </div>
        <form id="updateForm">
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th><input type="checkbox" /></th>
                  <th>Item</th>
                  <th>Date</th>
                  <th>Category</th>
                  <th>Quantity</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="itemTableBody">
                <tr><td colspan="6">Loading items...</td></tr>
              </tbody>
            </table>
          </div>
          <div class="sticky-footer">
            <button type="submit" class="save-btn"><i data-feather="save"></i> Save Changes</button>
          </div>
        </form>
      </section>
      <footer class="dashboard-footer">
        © 2025 SmartStock. Built by Henriette for individuals and businesses.
      </footer>
    </main>
  </div>
  <script>
    feather.replace();
    const token = localStorage.getItem('access_token');
    let fullItemList = [];

    function logout() {
      localStorage.removeItem('access_token');
      window.location.href = 'login.html';
    }

    function toggleFilterDropdown(e) {
      e.preventDefault();
      const dropdown = document.getElementById('filterDropdown');
      dropdown.style.display = dropdown.style.display === 'flex' ? 'none' : 'flex';
    }

    function applyFilter(status) {
      const tbody = document.getElementById('itemTableBody');
      tbody.innerHTML = '';
      const filtered = status === 'all' ? fullItemList : fullItemList.filter(item => item.status === status);
      renderTable(filtered);
      document.getElementById('filterDropdown').style.display = 'none';
    }

    function viewMoreToggle() {
      alert('View More clicked. This can be extended to load more data or show extra columns.');
    }

    async function fetchUserInfo() {
      try {
        const res = await fetch('http://localhost:8000/api/user/', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const user = await res.json();
        const name = user.first_name || user.username || 'User';
        document.getElementById('profileInitial').textContent = name[0].toUpperCase();
        document.getElementById('profileName').textContent = name;
        document.getElementById('welcomeText').textContent = `Welcome back, ${name}`;
      } catch (err) {
        console.error('User info error:', err);
        logout();
      }
    }

    async function getCategories() {
      const res = await fetch('http://localhost:8000/api/categories/', {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      return await res.json();
    }

    function renderTable(items) {
      const tbody = document.getElementById('itemTableBody');
      tbody.innerHTML = '';
      items.forEach(item => {
        const tr = document.createElement('tr');
        tr.dataset.id = item.id;
        const categoryOptions = item.allCategories.map(cat => {
          return `<option value="${cat.id}" ${cat.id === item.category.id ? 'selected' : ''}>${cat.name}</option>`;
        }).join('');
        tr.innerHTML = `
          <td><input type="checkbox" /></td>
          <td contenteditable="true">${item.name}</td>
          <td><input type="date" value="${item.date_added}" /></td>
          <td><select>${categoryOptions}</select></td>
          <td><input type="number" value="${item.quantity}" min="0" /></td>
          <td>
            <select>
              <option value="in_stock" ${item.status === 'in_stock' ? 'selected' : ''}>In Stock</option>
              <option value="running_low" ${item.status === 'running_low' ? 'selected' : ''}>Running Low</option>
              <option value="out_of_stock" ${item.status === 'out_of_stock' ? 'selected' : ''}>Out of Stock</option>
            </select>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function loadItems() {
      try {
        const [itemsRes, categories] = await Promise.all([
          fetch('http://localhost:8000/api/items/', {
            headers: { 'Authorization': `Bearer ${token}` }
          }),
          getCategories()
        ]);
        const items = await itemsRes.json();
        fullItemList = items.map(item => ({ ...item, allCategories: categories }));
        renderTable(fullItemList);
      } catch (err) {
        console.error('Error loading items or categories:', err);
        document.getElementById('itemTableBody').innerHTML = '<tr><td colspan="6">Failed to load items.</td></tr>';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      fetchUserInfo();
      loadItems();
      document.getElementById('updateForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const rows = document.querySelectorAll('tbody tr');
        for (let row of rows) {
          const id = row.dataset.id;
          const name = row.cells[1].textContent.trim();
          const date = row.cells[2].querySelector('input').value;
          const category = parseInt(row.cells[3].querySelector('select').value);
          const quantity = row.cells[4].querySelector('input').value;
          const status = row.cells[5].querySelector('select').value;

          await fetch(`http://localhost:8000/api/items/${id}/`, {
            method: 'PATCH',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ name, date_added: date, category_id: category, quantity, status })
          });
        }
        alert('Changes saved!');
        loadItems();
      });
    });
  </script>
</body>
</html>
